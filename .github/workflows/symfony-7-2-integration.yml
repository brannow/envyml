name: Symfony 7.2/7.4 Branch Integration

on:
  schedule:
    # Check daily at 3 AM UTC for Symfony 7.4 release
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force_check:
        description: 'Force check for Symfony 7.4'
        required: false
        default: 'false'

jobs:
  check-symfony-7-4-release:
    name: Check Symfony 7.4 Release Status
    runs-on: ubuntu-latest
    outputs:
      symfony_7_4_available: ${{ steps.check-release.outputs.available }}
      symfony_version: ${{ steps.check-release.outputs.version }}

    steps:
      - name: Check Symfony 7.4 availability
        id: check-release
        run: |
          # Check if Symfony 7.4 is available on Packagist
          SYMFONY_VERSION=$(curl -s https://repo.packagist.org/p2/symfony/cache.json | \
            jq -r '.packages["symfony/cache"] | keys[] | select(startswith("7.4"))' | \
            head -n 1)

          if [ ! -z "$SYMFONY_VERSION" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
            echo "version=$SYMFONY_VERSION" >> $GITHUB_OUTPUT
            echo "✅ Symfony 7.4 is available: $SYMFONY_VERSION"
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "version=" >> $GITHUB_OUTPUT
            echo "❌ Symfony 7.4 is not yet available"
          fi

  prepare-7-2-merge:
    name: Prepare 7-2 Branch for Master Merge
    runs-on: ubuntu-latest
    needs: check-symfony-7-4-release
    if: needs.check-symfony-7-4-release.outputs.symfony_7_4_available == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check branch existence
        id: check-branch
        run: |
          if git ls-remote --heads origin 7-2 | grep -q 7-2; then
            echo "branch_exists=true" >> $GITHUB_OUTPUT
            echo "✅ 7-2 branch exists"
          else
            echo "branch_exists=false" >> $GITHUB_OUTPUT
            echo "❌ 7-2 branch does not exist"
          fi

      - name: Fetch branches
        if: steps.check-branch.outputs.branch_exists == 'true'
        run: |
          git fetch origin master:master
          git fetch origin 7-2:7-2

      - name: Test merge feasibility
        if: steps.check-branch.outputs.branch_exists == 'true'
        id: test-merge
        run: |
          git checkout master
          if git merge --no-commit --no-ff 7-2; then
            echo "merge_possible=true" >> $GITHUB_OUTPUT
            echo "✅ Merge is possible without conflicts"
            git merge --abort
          else
            echo "merge_possible=false" >> $GITHUB_OUTPUT
            echo "❌ Merge has conflicts"
            git merge --abort || true
          fi

      - name: Create Pull Request for 7-2 to master
        if: steps.check-branch.outputs.branch_exists == 'true' && steps.test-merge.outputs.merge_possible == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto-merge-7-2-to-master
          base: master
          title: "feat: Merge Symfony 7.2/7.4 support into master"
          body: |
            ## 🎉 Symfony 7.4 Released!

            This PR automatically merges the `7-2` branch into `master` now that Symfony 7.4 has been released.

            **Symfony Version Detected:** ${{ needs.check-symfony-7-4-release.outputs.symfony_version }}

            ### Changes
            - Brings Symfony 7.2/7.4 compatibility from the `7-2` branch
            - Updates dependencies to support latest Symfony versions

            ### Checklist
            - [ ] Review changes carefully
            - [ ] Ensure all CI checks pass
            - [ ] Update CHANGELOG if necessary
            - [ ] Verify compatibility with all supported PHP versions

            ---
            *This PR was automatically created by the Symfony 7.4 integration workflow.*
          labels: |
            symfony
            automated-pr
            7-2-integration
          draft: false

      - name: Report merge conflicts
        if: steps.check-branch.outputs.branch_exists == 'true' && steps.test-merge.outputs.merge_possible == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Manual intervention needed: 7-2 branch merge has conflicts',
              body: `## Symfony 7.4 has been released!

              The automated merge from \`7-2\` to \`master\` cannot proceed due to merge conflicts.

              **Symfony Version:** ${{ needs.check-symfony-7-4-release.outputs.symfony_version }}

              ### Action Required
              Please manually merge the \`7-2\` branch into \`master\`:

              \`\`\`bash
              git checkout master
              git pull origin master
              git merge 7-2
              # Resolve conflicts
              git commit
              git push origin master
              \`\`\`

              ---
              *This issue was automatically created by the Symfony 7.4 integration workflow.*`,
              labels: ['symfony', 'manual-action-required', '7-2-integration']
            })

  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [check-symfony-7-4-release, prepare-7-2-merge]
    if: needs.check-symfony-7-4-release.outputs.symfony_7_4_available == 'true'

    steps:
      - name: Summary
        run: |
          echo "## ✅ Symfony 7.4 Integration Process Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Symfony Version:** ${{ needs.check-symfony-7-4-release.outputs.symfony_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "A pull request or issue has been created for merging the 7-2 branch." >> $GITHUB_STEP_SUMMARY
