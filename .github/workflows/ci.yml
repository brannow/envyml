name: CI

on:
  push:
    branches:
      - master
      - 7-2
  pull_request:
    branches:
      - master
      - 7-2
  workflow_dispatch:

jobs:
  tests:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        symfony: ['7.0.*', '7.1.*', '7.2.*']
        exclude:
          # Symfony 7.2 might not be available yet
          - php: '8.1'
            symfony: '7.2.*'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, yaml
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          composer require "symfony/cache:${{ matrix.symfony }}" \
                         "symfony/process:${{ matrix.symfony }}" \
                         "symfony/yaml:${{ matrix.symfony }}" \
                         "symfony/runtime:${{ matrix.symfony }}" \
                         --no-interaction --no-update || echo "Warning: Could not set specific Symfony version"
          composer update --prefer-dist --no-progress --no-interaction --ignore-platform-reqs
        continue-on-error: false

      - name: Validate composer.json
        run: composer validate --strict

      - name: Check syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Run tests (if test suite exists)
        run: |
          if [ -d "tests" ]; then
            vendor/bin/phpunit
          else
            echo "No test suite found, skipping tests"
          fi
        continue-on-error: true

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, yaml
          coverage: none
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Check for security vulnerabilities
        run: |
          composer audit || true

      - name: Validate composer.json
        run: composer validate --strict

  compatibility:
    name: PHP Compatibility Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Check minimum PHP version
        run: |
          echo "Project declares PHP requirement: $(composer show --self | grep 'requires' | grep 'php')"
          php -v
